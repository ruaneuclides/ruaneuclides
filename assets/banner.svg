<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Ruan Euclides — Software Engineering Student. Construindo software prático para problemas reais de negócio." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ruan Euclides — Software Engineering Student</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D18"/>
      <stop offset="0.55" stop-color="#0B1526"/>
      <stop offset="1" stop-color="#111C2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8FA3BF" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="2" fill="#22D3EE" fill-opacity="0.55"/>

  <!-- Texto -->
  <g font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="72" y="112" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="2.5" fill="#22D3EE">SOFTWARE ENGINEERING STUDENT</text>
    <text x="70" y="178" font-size="58" font-weight="700" letter-spacing="-1" fill="#F1F5F9">Ruan Euclides</text>
    <text x="72" y="222" font-size="20" fill="#A8B6CA">Construindo software prático para problemas reais de negócio.</text>
    <text x="72" y="262" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1" fill="#64748B">Fortaleza, BR  ·  Engenharia de Software — Estácio</text>
  </g>

  <!-- Conceito: do processo disperso ao sistema organizado -->
  <g stroke-linecap="round">
    <!-- entradas dispersas (pedidos, planilhas, e-mails) convergindo -->
    <g stroke="#3B4A63" stroke-width="1.2" fill="none">
      <path d="M760 92 C820 92, 840 160, 890 160"/>
      <path d="M742 136 C805 136, 835 160, 890 160"/>
      <path d="M776 188 C830 188, 845 160, 890 160"/>
      <path d="M752 232 C815 232, 840 160, 890 160"/>
      <path d="M790 60 C850 60, 845 160, 890 160"/>
    </g>
    <g fill="#5B6B85">
      <circle cx="790" cy="60" r="3.5"/>
      <circle cx="760" cy="92" r="4.5"/>
      <circle cx="742" cy="136" r="3"/>
      <circle cx="776" cy="188" r="5"/>
      <circle cx="752" cy="232" r="3.5"/>
    </g>
    <circle cx="718" cy="172" r="2" fill="#5B6B85" fill-opacity="0.6"/>
    <circle cx="810" cy="262" r="2.5" fill="#5B6B85" fill-opacity="0.6"/>

    <!-- hub -->
    <circle cx="896" cy="160" r="9" fill="#0B1526" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="896" cy="160" r="3" fill="#22D3EE"/>

    <!-- pipeline de etapas -->
    <g stroke="#2E5B7A" stroke-width="1.5">
      <line x1="905" y1="160" x2="936" y2="160"/>
      <line x1="984" y1="160" x2="1004" y2="160"/>
      <line x1="1052" y1="160" x2="1072" y2="160"/>
      <line x1="1120" y1="160" x2="1140" y2="160"/>
    </g>
    <g fill="#0E1A2C" stroke="#33506F" stroke-width="1.5">
      <rect x="936" y="140" width="48" height="40" rx="9"/>
      <rect x="1004" y="140" width="48" height="40" rx="9"/>
      <rect x="1072" y="140" width="48" height="40" rx="9"/>
    </g>
    <rect x="1140" y="140" width="48" height="40" rx="9" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-width="2"/>
    <g fill="#33506F">
      <rect x="948" y="157" width="24" height="6" rx="3"/>
      <rect x="1016" y="157" width="24" height="6" rx="3"/>
      <rect x="1084" y="157" width="24" height="6" rx="3"/>
    </g>
    <path d="M1153 160 l7 7 l13 -14" fill="none" stroke="#22D3EE" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- saída: dado organizado -->
    <g fill="#22D3EE">
      <rect x="1210" y="166" width="6" height="14" rx="2" fill-opacity="0.35"/>
      <rect x="1220" y="156" width="6" height="24" rx="2" fill-opacity="0.55"/>
      <rect x="1230" y="146" width="6" height="34" rx="2" fill-opacity="0.8"/>
    </g>
  </g>

  <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1" fill="#5B6B85" text-anchor="middle">
    <text x="766" y="292">processo</text>
    <text x="1062" y="212">sistema</text>
    <text x="1223" y="212">dado</text>
  </g>
</svg>
